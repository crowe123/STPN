<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="cost-t cost-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="cost-t">Cost of a routine septic pump-out compared with a drain field replacement</title>
  <desc id="cost-d">Drawn to a single scale from zero to twenty thousand dollars. A routine pump-out in Davidson County runs $275 to $525. Replacing a failed drain field runs $10,000 to $20,000. The pump-out bar is a sliver beside the replacement bar because routine pumping costs a small fraction of the repair it prevents.</desc>

  <rect width="800" height="400" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="76" fill="#F4F2ED"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#0D2C1F">What a pump-out costs, against what it prevents</text>
  <text x="40" y="65" font-size="13.5" fill="#47564E">Davidson County typical ranges, both bars on the same scale</text>

  <!-- routine pump-out -->
  <text x="140" y="122" font-size="14.5" font-weight="700" fill="#14432F">Routine pump-out</text>
  <rect x="148.5" y="132" width="7.8" height="32" fill="#256B4A"/>
  <path d="M156 148 H236" stroke="#256B4A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="244" y="153" font-size="16" font-weight="700" fill="#256B4A">$275 – $525</text>
  <text x="374" y="153" font-size="13" fill="#47564E">every 3 to 5 years</text>

  <!-- drain field replacement -->
  <text x="140" y="212" font-size="14.5" font-weight="700" fill="#B75505">Drain field replacement</text>
  <rect x="450" y="222" width="310" height="32" fill="#E4700D"/>
  <path d="M444 238 H236" stroke="#B75505" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="140" y="243" font-size="16" font-weight="700" fill="#B75505">$10,000 – $20,000</text>

  <!-- axis -->
  <path d="M140 292 H760" stroke="#0D2C1F" stroke-width="2"/>
  <g stroke="#0D2C1F" stroke-width="2">
    <path d="M140 292v8M295 292v8M450 292v8M605 292v8M760 292v8"/>
  </g>
  <g font-size="12.5" fill="#47564E" text-anchor="middle">
    <text x="140" y="318">$0</text>
    <text x="295" y="318">$5,000</text>
    <text x="450" y="318">$10,000</text>
    <text x="605" y="318">$15,000</text>
    <text x="760" y="318">$20,000</text>
  </g>

  <rect x="40" y="344" width="720" height="40" rx="4" fill="#DCEBE1"/>
  <text x="60" y="369" font-size="13.5" fill="#14432F">Regular pumping costs a fraction of a replacement and prevents the problem entirely.</text>
</svg>
