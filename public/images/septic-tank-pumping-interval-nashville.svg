<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="int-t int-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="int-t">How often a Nashville septic tank needs pumping</title>
  <desc id="int-d">Most residential septic tanks need pumping every three to five years. A household of four on a 1,000-gallon tank sits at the three-year end of that range. A household of two on a 1,500-gallon tank can often reach five years. Tank size and household size set the exact interval.</desc>

  <rect width="800" height="320" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="76" fill="#F4F2ED"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#0D2C1F">How often a Nashville tank needs pumping</text>
  <text x="40" y="65" font-size="13.5" fill="#47564E">Tank size and household size set where a system falls in the range</text>

  <!-- range band -->
  <rect x="160" y="150" width="540" height="26" rx="13" fill="#DCEBE1"/>
  <path d="M160 163 H700" stroke="#256B4A" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- axis -->
  <g stroke="#0D2C1F" stroke-width="2">
    <path d="M160 176v10M430 176v10M700 176v10"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0D2C1F" text-anchor="middle">
    <text x="160" y="206">3 years</text>
    <text x="430" y="206">4 years</text>
    <text x="700" y="206">5 years</text>
  </g>
  <text x="430" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#256B4A">TYPICAL RANGE FOR A RESIDENTIAL TANK</text>

  <!-- marker: shorter interval -->
  <g>
    <circle cx="160" cy="163" r="9" fill="#E4700D"/>
    <circle cx="160" cy="163" r="3.5" fill="#FFFFFF"/>
    <path d="M160 110 v34" stroke="#B75505" stroke-width="2"/>
    <text x="160" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#B75505">Household of 4</text>
    <text x="160" y="84" text-anchor="middle" font-size="13" fill="#47564E">1,000-gallon tank</text>
  </g>

  <!-- marker: longer interval -->
  <g>
    <circle cx="700" cy="163" r="9" fill="#14432F"/>
    <circle cx="700" cy="163" r="3.5" fill="#FFFFFF"/>
    <path d="M700 110 v34" stroke="#14432F" stroke-width="2"/>
    <text x="700" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#14432F">Household of 2</text>
    <text x="700" y="84" text-anchor="middle" font-size="13" fill="#47564E">1,500-gallon tank</text>
  </g>

  <rect x="40" y="248" width="720" height="40" rx="4" fill="#F4F2ED"/>
  <text x="60" y="273" font-size="13.5" fill="#14432F">The technician measures the tank on site and sets the exact interval, so planning replaces guessing.</text>
</svg>
