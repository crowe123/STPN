<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="warn-t warn-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="warn-t">Where the signs of a full septic tank show up on a property</title>
  <desc id="warn-d">A house and yard in cross-section with the warning signs marked at the place each one appears. Inside the house: toilets that flush slowly or gurgle, and several drains running slow at once. At the house and in the yard: sewage odor. Out over the drain field: wet, spongy patches of grass where liquid waste is surfacing. A fifth sign is not spatial at all — more than five years since the last pump-out means the tank is due regardless of symptoms.</desc>

  <rect width="800" height="420" fill="#FFFFFF"/>
  <rect x="0" y="0" width="800" height="70" fill="#B75505"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#FFFFFF">Where the signs show up</text>
  <text x="40" y="60" font-size="13" fill="#FFE2CB">Any one of these is a reason to call, not to wait for the next interval</text>

  <!-- scene -->
  <rect x="40" y="90" width="390" height="125" fill="#F4F2ED"/>
  <rect x="40" y="215" width="390" height="135" fill="#EDE7DB"/>
  <rect x="40" y="211" width="390" height="6" fill="#B9CFC2"/>

  <!-- house with cutaway -->
  <path d="M60 215v-70l55-34 55 34v70z" fill="#FFFFFF" stroke="#0D2C1F" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M52 148 115 109l63 39" fill="none" stroke="#14432F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 180 H170" stroke="#DFDCD3" stroke-width="1.5"/>
  <rect x="96" y="156" width="14" height="16" rx="2" fill="#B9CFC2" stroke="#0D2C1F" stroke-width="1.5"/>
  <rect x="96" y="190" width="14" height="16" rx="2" fill="#B9CFC2" stroke="#0D2C1F" stroke-width="1.5"/>
  <path d="M140 172 v34" stroke="#47564E" stroke-width="2.5"/>

  <!-- odor wisps -->
  <g fill="none" stroke="#B75505" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M196 150c6-8 0-14 6-22M212 154c6-8 0-14 6-22"/>
  </g>

  <!-- drain line, tank, field -->
  <path d="M170 224 H240" stroke="#0D2C1F" stroke-width="6" stroke-linecap="round"/>
  <rect x="240" y="235" width="80" height="58" rx="4" fill="#FFFFFF" stroke="#0D2C1F" stroke-width="3"/>
  <rect x="243" y="262" width="74" height="28" fill="#DCEBE1"/>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14432F">TANK</text>
  <path d="M320 258 H344 V268" fill="none" stroke="#0D2C1F" stroke-width="5"/>
  <g>
    <rect x="336" y="268" width="88" height="16" rx="3" fill="#D8CDB4" stroke="#0D2C1F" stroke-width="1.5"/>
    <rect x="336" y="292" width="88" height="16" rx="3" fill="#D8CDB4" stroke="#0D2C1F" stroke-width="1.5"/>
    <text x="380" y="326" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14432F">DRAIN FIELD</text>
  </g>
  <ellipse cx="380" cy="216" rx="46" ry="9" fill="#256B4A" opacity="0.35"/>

  <!-- pins -->
  <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="103" cy="164" r="13" fill="#E4700D"/><text x="103" y="169">1</text>
    <circle cx="206" cy="120" r="13" fill="#E4700D"/><text x="206" y="125">2</text>
    <circle cx="380" cy="216" r="13" fill="#E4700D"/><text x="380" y="221">3</text>
    <circle cx="140" cy="198" r="13" fill="#E4700D"/><text x="140" y="203">4</text>
  </g>

  <!-- leaders -->
  <g stroke="#DFDCD3" stroke-width="1.5" fill="none">
    <path d="M116 164 H460"/>
    <path d="M219 120 H300 M300 120 V178 H460"/>
    <path d="M393 216 H424 M424 216 V232 H460"/>
    <path d="M153 198 H300 M300 198 V286 H460"/>
  </g>

  <!-- labels -->
  <g>
    <text x="470" y="158" font-size="14.5" font-weight="700" fill="#0D2C1F">Toilets flush slowly or gurgle</text>
    <text x="470" y="176" font-size="12.5" fill="#47564E">Solids backing up toward the drain lines</text>
  </g>
  <g>
    <text x="470" y="212" font-size="14.5" font-weight="700" fill="#0D2C1F">Sewage odor, indoors or in the yard</text>
    <text x="470" y="230" font-size="12.5" fill="#47564E">Gas escaping from an overfull tank</text>
  </g>
  <g>
    <text x="470" y="266" font-size="14.5" font-weight="700" fill="#0D2C1F">Wet, spongy grass over the field</text>
    <text x="470" y="284" font-size="12.5" fill="#47564E">Liquid waste surfacing, field overwhelmed</text>
  </g>
  <g>
    <text x="470" y="320" font-size="14.5" font-weight="700" fill="#0D2C1F">Several slow drains at once</text>
    <text x="470" y="338" font-size="12.5" fill="#47564E">System-wide, not a single clog</text>
  </g>

  <!-- the non-spatial fifth -->
  <rect x="40" y="368" width="720" height="40" rx="4" fill="#EDE7DB"/>
  <circle cx="70" cy="388" r="13" fill="#14432F"/>
  <text x="70" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
  <text x="94" y="393" font-size="13.5" fill="#14432F">The one with no symptom: more than 5 years since the last pump-out. The tank is due regardless.</text>
</svg>
